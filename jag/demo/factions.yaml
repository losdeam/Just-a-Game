# 演示势力

factions:
  - id: villagers
    name: 灰石村民
    description: 灰石村的和平居民。他们重视社区和安全。
    faction_type: community
    leader_id: innkeeper_mara
    members: [innkeeper_mara, blacksmith_duran, hunter_lyra]
    goals: [维护和平, 保护村庄, 通过贸易繁荣发展]
    resources:
      gold: 500
      influence: 20

  - id: darkwood_bandits
    name: 暗影强盗团
    description: 一伙在暗影森林中抢劫旅行者的法外之徒。
    faction_type: criminal
    leader_id: thief_shadow
    members: [thief_shadow]
    goals: [积累财富, 控制森林, 寻找遗迹中的宝藏]
    resources:
      gold: 300
      influence: 10

relations:
  - faction_a: villagers
    faction_b: darkwood_bandits
    relation: hostile
