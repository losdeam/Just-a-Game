# 演示世界：灰石村与暗影森林

regions:
  - id: greystone
    name: 灰石村
    description: 坐落在黑暗森林边缘的宁静村庄。石砌建筑沿着鹅卵石街道排列。
    region_type: settlement
    danger_level: 1

  - id: darkwood
    name: 暗影森林
    description: 一片古老的森林，浓密的树冠几乎遮蔽了所有阳光。诡异的声响在树木间回荡。
    region_type: wilderness
    danger_level: 5

locations:
  # 灰石村
  - id: village_square
    name: 村庄广场
    description: 灰石村的中心。一座风化的石制喷泉矗立在中央。村民们聚集在此交流消息和交易货物。
    region_id: greystone
    location_type: outdoor
    light_level: 8
    danger_level: 0
    connected: [tavern, blacksmith, village_gate, market_stall]
    tags: [social, trade]

  - id: tavern
    name: 炉石客栈
    description: 一家温暖宜人的客栈，壁炉里火焰熊熊。新鲜面包和炖菜的香气弥漫在空气中。
    region_id: greystone
    location_type: indoor
    light_level: 6
    danger_level: 0
    connected: [village_square]
    tags: [rest, social, food]

  - id: blacksmith
    name: 铁砧铁匠铺
    description: 锤击铁砧的节奏声不绝于耳。墙壁上挂满了各式武器和工具。
    region_id: greystone
    location_type: indoor
    light_level: 5
    danger_level: 0
    connected: [village_square]
    tags: [trade, craft]

  - id: market_stall
    name: 集市摊位
    description: 木桌上摆满了琳琅满目的商品。异国香料、干草药和各种奇特的小饰品。
    region_id: greystone
    location_type: outdoor
    light_level: 8
    danger_level: 0
    connected: [village_square]
    tags: [trade]

  - id: village_gate
    name: 村口大门
    description: 标志着文明与荒野界限的木制大门。守卫在此站岗放哨。
    region_id: greystone
    location_type: outdoor
    light_level: 7
    danger_level: 1
    connected: [village_square, forest_path]
    tags: [transition]

  # 暗影森林
  - id: forest_path
    name: 森林小径
    description: 一条蜿蜒穿过幽暗树林的小径。鸟鸣声已消失，取而代之的是令人不安的寂静。
    region_id: darkwood
    location_type: outdoor
    light_level: 3
    danger_level: 3
    connected: [village_gate, forest_camp, ruins_entrance]
    tags: [wilderness]

  - id: forest_camp
    name: 隐秘营地
    description: 一个隐蔽的营地，火塘已冷却。有人最近在此居住过。
    region_id: darkwood
    location_type: outdoor
    light_level: 2
    danger_level: 4
    connected: [forest_path]
    tags: [wilderness, hideout]

  - id: ruins_entrance
    name: 遗迹入口
    description: 覆满古代符文的崩塌石拱门。一股冷风从内部吹出。
    region_id: darkwood
    location_type: outdoor
    light_level: 2
    danger_level: 6
    connected: [forest_path]
    tags: [dungeon, ancient]
