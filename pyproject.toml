[project]
name = "jag"
version = "0.1.0"
description = "Agentic Open World RPG Framework"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "litellm>=1.0",
    "instructor>=1.0",
    "sqlmodel>=0.0.22",
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
jag = "jag.cli:main"
